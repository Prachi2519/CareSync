services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caresync
      POSTGRES_USER: caresync
      # Local-only database on the internal Compose network. Production uses an authenticated managed URL.
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caresync -d caresync"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - caresync-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  caresync:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://caresync@db:5432/caresync?schema=public
      APP_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  notification-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "scripts/notification-worker.mjs"]
    depends_on:
      - caresync
    env_file:
      - .env
    environment:
      APP_URL: http://caresync:3000
    restart: unless-stopped

volumes:
  caresync-postgres-data:
