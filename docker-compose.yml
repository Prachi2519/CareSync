services:
  caresync:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/data/caresync.db
      APP_URL: http://localhost:3000
    volumes:
      - caresync-data:/data
    restart: unless-stopped

  notification-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "scripts/notification-worker.mjs"]
    depends_on:
      - caresync
    env_file:
      - .env
    environment:
      APP_URL: http://caresync:3000
    restart: unless-stopped

volumes:
  caresync-data:
